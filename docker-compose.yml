services:
  kafka:
    image: apache/kafka:latest
    container_name: ad-fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # INTERNAL (9093) for Docker containers, EXTERNAL (9092) for host machine
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://ad-fraud-kafka:9093,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ad-fraud-kafka:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    networks:
      - ad-fraud-net
      - floci-net

  spark:
    image: apache/spark:3.5.0-python3
    container_name: ad-fraud-spark
    command: tail -f /dev/null
    environment:
      - AWS_ACCESS_KEY_ID=floci
      - AWS_SECRET_ACCESS_KEY=floci
    volumes:
      - ./spark:/opt/spark-apps
      - ./ml:/opt/ml
    networks:
      - ad-fraud-net
      - floci-net

networks:
  ad-fraud-net:
    name: ad-fraud-net

  floci-net:
    external: true